<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Naiqo</title>
    <meta name="description" content="Reserva cita en tu salón favorito" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/naiqo-cliente-icon.png" />
    <link rel="apple-touch-icon" href="/naiqo-cliente-icon.png" />

    <!-- PWA — manifest de la app cliente -->
    <link rel="manifest" href="/manifest-cliente.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Naiqo" />

    <meta name="theme-color" content="#9333ea" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
